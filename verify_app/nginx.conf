server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DocumentViewer renders uploaded-document markdown through rehype-raw
    # (raw HTML allowed), so the CSP is the real XSS backstop here: no
    # inline or third-party script can run, and nothing can frame the app.
    # 'unsafe-inline' for styles only -- Radix sets inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Single-page app: any path that isn't a real file falls back to
    # index.html, so a hard refresh on a deep route doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only the two API areas this app actually calls (src/api/client.js)
    # are proxied -- the admin endpoints are not reachable from this host.
    location ~ ^/api/v1/(auth|verification)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # .docx uploads; nginx's 1m default rejects most real documents.
        client_max_body_size 25m;
    }

    location /api/ {
        return 404;
    }
}
